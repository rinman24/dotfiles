# ~/.config/tmux/tmux.conf — managed by chezmoi (rinman24/dotfiles)

# Terminal
set-option -g default-terminal 'tmux-256color'
set-option -sa terminal-features ',xterm*:RGB'

# User defined custom options
set -g @accent_local '#89b4fa'
set -g @text '#cdd6f4'
set -g @overlay_0 '#6c7086'
set -g @surface_1 '#45475a'
set -g @surface_0 '#313244'
set -g @base '#1e1e2e'
set -g @mantle '#181825'
set -g @crust '#11111b'

# billet publishes @billet_workspace / @billet_host / @billet_color as data (ADR-0008);
# rendering is ours. Its prelude is `tmux set -g @billet_* ... \; new-session -A ...`, and
# the first `set -g` is what starts the server — so this file is sourced BEFORE those
# options exist. Anything baked with `set -F` at load can never see them (verified: bakes
# the fallback, always). @accent therefore holds an unexpanded format, read as
# #{E:@accent}, which style options re-resolve on every redraw. New consumers of @accent
# must use #{E:@accent} — a bare #{@accent} now interpolates the format text itself.
set -g @accent '#{?#{@billet_color},#{@billet_color},#{@accent_local}}'

# Escaping rule for every style and format option below. `set -gF` expands the
# whole value ONCE, at load, and stores the result; plain `set -g` stores the
# text verbatim and tmux re-expands it on every redraw. So `-F` is used here
# only where the value is built purely from the plain-hex palette vars above
# (@accent_local, @text, @overlay_0, @surface_1, @surface_0, @base, @mantle,
# @crust) — those are literals, so baking them costs nothing. Anything that
# depends on @accent, on billet's @billet_* data, or on client state such as
# client_prefix must use plain `set -g` and spell the accent #{E:@accent}: under
# `-F` the E: form bakes the local fallback permanently (verified — it resolves
# @accent_local at load and can never see a Workspace colour published later),
# while a bare #{@accent} bakes the format's own source text into the style
# string, which is not a colour. This file does no `##`-guarding; the `set -g`
# vs `set -gF` split is the whole mechanism that keeps render-time formats live.

# General options
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -gF status-style 'bg=#{@mantle},fg=#{@overlay_0}'
set -g status-left-length 40
set -g status-right-length 120
set -g mouse on
set -g prefix C-a
set -g base-index 1
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g escape-time 0  # Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -g history-limit 1000000  # increase history size (from 2,000)
set -g renumber-windows on
set -g set-clipboard on
set -g display-time 4000
set -g message-style 'bg=#{E:@accent},fg=#{@crust},fill=#{E:@accent},bold'
set -g message-command-style 'fg=#{@crust},bg=#{E:@accent}'
set -g focus-events on

# Window options
set -gw pane-base-index 1
set -gw aggressive-resize on
set -gw copy-mode-position-style 'fg=#{E:@accent},bg=#{@surface_0}'
set -gwF copy-mode-match-style 'bg=#{@surface_1},fg=#{@text}'
set -gw copy-mode-current-match-style 'bg=#{E:@accent},fg=#{@crust}'
set -gw mode-style 'fg=#{@crust},bg=#{E:@accent}'

# Key bindings
bind C-p previous-window  # Enhance default by allowing you to hold `Ctrl`
bind C-n next-window  # Enhance default by allowing you to hold `Ctrl`
bind C-y display-popup -d "#{pane_current_path}"  # New popup on current path
bind R source-file ~/.config/tmux/tmux.conf \; display-message " Config reloaded"  # Reload config
unbind C-b
bind C-a send-prefix
bind a last-window

# Left: prefix dot (lights up in the accent while prefix is armed) + session block
set -g status-left '#[fg=#{?client_prefix,#{E:@accent},#{@surface_0}}] ● #[fg=#{@crust},bg=#{E:@accent},bold] #{?#{@billet_workspace},#{@billet_workspace},#S} #[default]  '

# Windows: dim text; active = surface block, accent number, accent underline
set -g window-status-separator ''
set -g window-status-format '#[fg=#{@overlay_0}] #I #W '
set -g window-status-current-format '#[fg=#{E:@accent}] #I #[fg=#{@text},nobold]#W '
set -g window-status-current-style 'bg=#{@surface_0},bold,underscore,us=#{E:@accent}'

# Right: checkout · cpu · memory · battery · host · date · time block

# Base style
set -g status-right "#[fg=#{@overlay_0}]"

# Dynamic system information
set -ag status-right '#(~/.config/tmux/scripts/status-segment.sh checkout #{q:pane_current_path})'
set -ag status-right "#(~/.config/tmux/scripts/status-segment.sh cpu)"
set -ag status-right "#(~/.config/tmux/scripts/status-segment.sh memory)"
set -ag status-right "#(~/.config/tmux/scripts/status-segment.sh battery)"

# Host and date
set -ag status-right "#{?#{@billet_host},#{@billet_host},#h} %d %b "

# Time block
set -ag status-right "#[fg=#{@text},bg=#{@surface_0}] %H:%M "

# Quiet chrome to match
set -gwF pane-border-style 'fg=#{@surface_0}'
set -gwF pane-active-border-style 'fg=#{@surface_1}'
set -gwF clock-mode-colour '#{@accent_local}'
set -gw display-panes-time 4000
set -gwF display-panes-active-colour '#{@accent_local}'
set -gwF display-panes-colour '#{@overlay_0}'
set -gwF copy-mode-mark-style 'bg=#{@surface_1},fg=#{@text}'
set -gF menu-style 'bg=#{@mantle},fg=#{@text}'
set -g menu-selected-style 'bg=#{E:@accent},fg=#{@crust},bold'
set -gF menu-border-style 'bg=#{@mantle},fg=#{@surface_0}'
set -gwF popup-style 'bg=#{@base},fg=#{@text}'
set -gwF popup-border-style 'fg=#{@surface_0}'