# ~/.config/tmux/tmux.conf — managed by chezmoi (rinman24/dotfiles)

# Terminal
set-option -g default-terminal 'tmux-256color'
set-option -sa terminal-features ',xterm*:RGB'

# General options
set -g mouse on
set -g prefix ^A
set -g base-index 1           # start indexing windows at 1 instead of 0
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g escape-time 0          # zero-out escape time delay
set -g history-limit 1000000  # increase history size (from 2,000)
set -g renumber-windows on    # renumber all windows when any window is closed
set -g set-clipboard on       # use system clipboard

# Key bindings
bind C-y display-popup -d "#{pane_current_path}" -E "bash"
bind C split-window -v -c "#{pane_current_path}" "claude --dangerously-skip-permissions"

# ── Palette ────────────────────────────────────────────────────────────
# Plain literals — no theme plugin, no plugin manager. Recolouring the whole
# status line is a six-line diff. Referenced below as #{@c_*}, which `set -F`
# expands once at load; none of it is resolved per-redraw.
set -g @c_bar    "#181825"  # status bar background
set -g @c_dim    "#6c7086"  # inactive text
set -g @c_fg     "#cdd6f4"  # normal foreground
set -g @c_accent "#cba6f7"  # active window / default identity pill
set -g @c_alert  "#f38ba8"  # prefix held
set -g @c_dark   "#11111b"  # foreground on any filled block

# ── Status bar ─────────────────────────────────────────────────────────
# Escaping rule for everything below: `#{@c_*}` (single #) is expanded now and
# the hex is baked in; `##{...}` / `##S` / `##I` survive load and are evaluated
# on every redraw. `set -gF` without the `##` guard silently expands the
# render-time formats against no context and yields a blank bar.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -gF status-style "bg=#{@c_bar},fg=#{@c_dim}"
set -g status-left-length 60
set -g status-right-length 40

# Identity pill colour: the Workspace's status_color when billet published one
# (ADR-0008), otherwise the accent; always red while the prefix is held.
set -gF @_pill_bg "##{?client_prefix,#{@c_alert},##{?##{@billet_color},##{@billet_color},#{@c_accent}}}"

# Left: one pill. In a billet Workspace it shows the Workspace key; locally it
# shows the session name. billet defaults tmux_session to the Workspace key
# (ADR-0008 rule 6), so those are the same string there — show it once.
set -gF status-left "#[fg=##{E:@_pill_bg},bg=#{@c_bar}]"
set -agF status-left "#[fg=#{@c_dark},bg=##{E:@_pill_bg}] ##{?##{@billet_workspace},##{@billet_workspace},##S} "
set -agF status-left "#[fg=##{E:@_pill_bg},bg=#{@c_bar}] "

# Windows: inactive are plain dim text, only the active one gets a filled pill.
set -g window-status-separator ""
set -gF window-status-format "#[fg=#{@c_dim},bg=#{@c_bar}] ##I ##W  "
set -gF window-status-current-format "#[fg=#{@c_accent},bg=#{@c_bar}]#[fg=#{@c_dark},bg=#{@c_accent}] ##I ##W #[fg=#{@c_accent},bg=#{@c_bar}] "

# Right: the Host, but only inside a billet Workspace, then the clock.
set -gF status-right "#[fg=#{@c_dim},bg=#{@c_bar}]##{?##{@billet_host},##{@billet_host}  ,}%H:%M "

# ── Incidental surfaces ────────────────────────────────────────────────
set -gF message-style "fg=#{@c_dark},bg=#{@c_accent}"
set -gF message-command-style "fg=#{@c_dark},bg=#{@c_accent}"
set -gF mode-style "fg=#{@c_dark},bg=#{@c_accent}"
set -gF pane-border-style "fg=#{@c_dim}"
set -gF pane-active-border-style "fg=#{@c_accent}"
set -gF clock-mode-colour "#{@c_accent}"
